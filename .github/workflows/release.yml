name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  # mise exec and mise run would install every tool a job leaves out, without the token.
  MISE_AUTO_INSTALL: "false"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  draft:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git-cliff reads the tags and the history before them.
          fetch-depth: 0
      - run: |
          grep -Fqx "    fap_version=\"${GITHUB_REF_NAME#v}\"," application.fam || {
              echo "::error::$GITHUB_REF_NAME: application.fam lacks fap_version=\"${GITHUB_REF_NAME#v}\""
              exit 1
          }
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          # mise does not check a restored tool cache against mise.lock.
          cache: false
          install_args: uv pypi:ufbt git-cliff
      # ci.yml's deploy: the inner sh reads the pin inside mise.
      - run: |
          # shellcheck disable=SC2016
          mise exec -- sh -c 'ufbt update --branch "$FLIPPER_SDK_VERSION"'
      - run: mise run build
      - run: mise exec -- git-cliff --current --strip all --output notes.md
      - run: |
          # --draft turns off gh's own refusal of a published Release and its deletion of a draft whose upload failed.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              echo "::error::$GITHUB_REF_NAME: a Release exists"
              exit 1
          fi
          # Without --verify-tag, gh cuts a missing tag from the default branch.
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" \
              --notes-file notes.md dist/f0_claude_remote.fap
        env:
          GH_TOKEN: ${{ github.token }}

  flipper-apps-catalog:
    needs: draft
    runs-on: ubuntu-24.04
    environment: flipper-apps-catalog
    steps:
      - run: |
          set -eu
          fork=$GITHUB_REPOSITORY_OWNER/flipper-application-catalog
          prefix=$GITHUB_REPOSITORY_OWNER/f0_claude_remote_
          name=${GITHUB_REF_NAME#v}
          manifest=applications/Bluetooth/f0_claude_remote/manifest.yml

          gh repo sync "$fork" --branch main
          main=$(gh api "repos/$fork/commits/heads/main" --jq .sha)

          # set -e ignores a failed substitution in a for list, which would then walk the error body.
          refs=$(gh api "repos/$fork/git/matching-refs/heads/$prefix" --jq '.[].ref')
          for ref in $refs; do
              gh api --method DELETE "repos/$fork/git/$ref"
          done

          gh api "repos/$fork/git/refs" --silent -f ref="refs/heads/$prefix$name" -f sha="$main"

          # The fork's token stays with the fork.
          commit=$(GH_TOKEN=$REPOSITORY_TOKEN gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF" --jq .sha)

          cat > manifest.yml <<EOF
          sourcecode:
            type: git
            location:
              origin: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git
              commit_sha: $commit
          description: "@catalog/description.md"
          changelog: "@catalog/changelog.md"
          screenshots:
            - screenshots/main.png
          EOF
          content=$(base64 -w 0 manifest.yml)

          # A 404 prints its body as the output, so the exit status alone tells the file is there.
          if blob=$(gh api "repos/$fork/contents/$manifest?ref=$main" --jq .sha); then
              gh api --method PUT "repos/$fork/contents/$manifest" --silent \
                  -f message="Update Claude Remote to $name" -f content="$content" \
                  -f branch="$prefix$name" -f sha="$blob"
          else
              gh api --method PUT "repos/$fork/contents/$manifest" --silent \
                  -f message="Add Claude Remote $name" -f content="$content" \
                  -f branch="$prefix$name"
          fi
        env:
          GH_TOKEN: ${{ secrets.FLIPPER_APPS_CATALOG_TOKEN }}
          REPOSITORY_TOKEN: ${{ github.token }}

  # Last: publishing locks the tag and the assets.
  publish:
    needs: flipper-apps-catalog
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
