[changelog]
# The catalog's Markdown filter refuses backticks and headers past H2, and Python-Markdown
# opens a list only after a blank line. The oldest release adds no blank line after itself,
# so the file ends in one newline.
body = """
{{ version }}:

{% set shown = commits | filter(attribute="group", value="shown") %}\
{% for commit in shown %}\
    - {{ commit.message | replace(from="`", to="") | upper_first }}
{% else %}\
    - Internal changes only
{% endfor %}\
{% if previous.version %}
{% endif %}\
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+$'
topo_order = false
sort_commits = "oldest"
# Nothing is skipped: git-cliff drops a release left with no commit.
commit_parsers = [
  { message = "^(feat|fix)", group = "shown" },
  { message = ".*", group = "hidden" },
]
