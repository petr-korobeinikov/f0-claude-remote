[changelog]
header = "# Changelog\n"
# The blank line opens each section and no footer is set:
# a section ending in one, or a footer, ends the file in two blank lines,
# which end-of-file-fixer rewrites.
body = """

{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} (`{{ commit.id | truncate(length=7, end="") }}`)\
    {% endfor %}
{% endfor %}\
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+$'
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  # The release commit postdates the file it writes, so listing it would part the notes from the file;
  # a plan and its archive restate their change.
  { message = '^chore: release [0-9]+\.[0-9]+', skip = true },
  { message = '^chore\(openspec\)', skip = true },
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
  { message = "^docs", group = "<!-- 4 -->📚 Documentation" },
  { message = "^test", group = "<!-- 5 -->🧪 Testing" },
  { message = "^(build|ci)", group = "<!-- 6 -->🏗️ Build & CI" },
  { message = "^chore", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { message = "^style", group = "<!-- 8 -->🎨 Styling" },
  { message = "^revert", group = "<!-- 9 -->◀️ Reverts" },
  { message = ".*", group = "<!-- 10 -->💼 Other" },
]
